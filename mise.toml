# Adapted from spike-html-apps-foundation (07ba39a): mise.toml, its pins at their latest, and screenshots on web-tooling's bin.
# Adapted from spike-html-packages-foundation (5dd8a58): mise.toml, renamed.
# The foundation's toolchain and tasks.
# See docs/development.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
actionlint = "1.7.12"
node = "26.13.1"
pnpm = "12.23.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[tools."http:chrome-headless-shell"]
version = "158.0.8127.36"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a", size = "132087165" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, actionlint, lint-context, and lint-references"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows", "lint:context"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint, which shellchecks each run: block"
run = "actionlint"

[tasks."lint:context"]
description = "Lint the context and every reference with marathon's lint-context and lint-references"
run = "scripts/lint-marathon.sh"

[tasks.types]
description = "Type-check the sources and the suite with tsc"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check the sources with tsc"
run = "tsc --noEmit -p ."

[tasks."types:test"]
description = "Type-check the suite and the capture description with tsc, under tsconfig.test.json, against dist/'s declarations"
depends = ["build"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with the .css and handwritten .d.ts beside it"
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the sources, the lint, and a pack of the build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check: the linters, lint-context and lint-references among them, types, build, and the unit and browser tiers; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.demo]
description = "Serve the tools, profiles, specimen, theme, unit, keys, format, hooks, utilities, dialogs, app, and prose demo pages, on dist/, on the loopback address"
depends = ["build"]
run = "node scripts/demo.js"

[tasks.screenshots]
description = "Capture the tools page, the hooks page, the utilities page with and without motion, the dialogs page with a hint shown and each dialog open at 390px and wide, the application and reading pages at 390px with 200% text and wide, the formatters page, and the color specimen light and dark, inline in kitty: at the defaults, or --palette/--space/--type <name>, or --all for every profile; --page <name> (repeatable) and --scheme light|dark narrow it; --output terminal|directory|browser and --dir <path> choose where they go; --keep leaves the captures"
depends = ["preflight browser", "build"]
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec web-screenshots scripts/screenshots.config.ts"

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, and the tooling's tag behind its latest, exiting nonzero if any; reads the network"
run = "scripts/currency.sh"
quiet = true
