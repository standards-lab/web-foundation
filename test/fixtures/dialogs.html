<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dialogs fixture</title>
    <link rel="stylesheet" href="../../dist/page-full.css" />
    <link rel="stylesheet" href="../../dist/glyph-button.css" />
    <link rel="stylesheet" href="../../dist/dialog.css" />
    <style>
      @layer foundation, app;
      @layer app {
        .app-tight {
          padding: 0;
        }
        .app-flush {
          margin-block-end: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="light"></div>
    <div id="shadow"></div>
    <div id="app">
      <button type="button" class="glyph-button app-tight" data-part="tight">Tight</button>
      <header class="dialog-header app-flush" data-part="flush"><h2>Flush</h2></header>
    </div>
  </body>
</html>
