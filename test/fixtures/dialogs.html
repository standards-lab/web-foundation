<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dialogs fixture</title>
    <!-- The glyph-button and dialog sheets the foundation adds, from dist/, for
         test/browser/dialogs.test.ts: the full page entry, so a profile's attribute on the root
         selects it, with glyph-button.css and dialog.css linked after it. The page runs no script:
         its buttons open, close and hint by the platform alone. #light takes
         test/browser/support/dialogs.js's cases, which it also lays out in a shadow root, in
         #shadow. #app holds a glyph button and a header row under the page's own later layer,
         which overrides them. -->
    <link rel="stylesheet" href="../../dist/page-full.css" />
    <link rel="stylesheet" href="../../dist/glyph-button.css" />
    <link rel="stylesheet" href="../../dist/dialog.css" />
    <style>
      @layer foundation, app;
      @layer app {
        .app-tight {
          padding: 0;
        }
        .app-flush {
          margin-block-end: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="light"></div>
    <div id="shadow"></div>
    <div id="app">
      <button type="button" class="glyph-button app-tight" data-part="tight">Tight</button>
      <header class="dialog-header app-flush" data-part="flush"><h2>Flush</h2></header>
    </div>
  </body>
</html>
