<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>controls fixture</title>
    <link rel="stylesheet" href="../../dist/page-full.css" />
    <style>
      @layer foundation, app;
      @layer app {
        progress,
        meter {
          display: block;
          inline-size: 20rem;
          block-size: 2rem;
        }
        .accented {
          --color-accent: rgb(153, 51, 102);
        }
        .offset {
          --focus-offset: 5px;
        }
      }
    </style>
  </head>
  <body>
    <h1>controls fixture</h1>
    <p id="controls">
      <input type="text" value="field" aria-label="field" />
      <select aria-label="select">
        <option>select</option>
      </select>
      <button type="button">button</button>
    </p>
    <p id="focus">
      <input type="text" value="default" aria-label="default offset" />
      <span class="offset"><input type="text" value="set" aria-label="offset set" /></span>
    </p>
    <p id="disabled">
      <input type="text" value="field" aria-label="disabled field" disabled />
      <select aria-label="disabled select" disabled>
        <option>select</option>
      </select>
      <textarea rows="1" aria-label="disabled text area" disabled>text area</textarea>
      <input class="enabled" type="text" value="enabled" aria-label="enabled field" />
    </p>
    <div id="bars">
      <progress id="progress" value="40" max="100" aria-label="progress">40%</progress>
      <progress id="indeterminate" aria-label="indeterminate progress">Working</progress>
      <meter id="optimum" value="0.8" aria-label="optimum meter">80%</meter>
      <meter id="low" value="0.5" low="0.6" high="0.8" optimum="0.9" aria-label="low meter">
        50%
      </meter>
      <div class="accented">
        <progress id="accented" value="40" max="100" aria-label="accented progress">40%</progress>
        <progress id="accented-indeterminate" aria-label="accented indeterminate progress">
          Working
        </progress>
      </div>
    </div>
    <div id="scope" data-space="compact"><i class="probe"></i></div>
    <i id="probe" class="probe"></i>
  </body>
</html>
