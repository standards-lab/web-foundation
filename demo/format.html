<!doctype html>
<!-- From spike-html-apps-foundation (07ba39a): demo/format.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation formatters</title>
    <link rel="stylesheet" href="../dist/page.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module">
      import {
        formatBytes,
        formatDate,
        formatDateTime,
        formatDuration,
        formatRelative,
        JSON_MAX_DEPTH,
        tryFormatJson,
      } from "../dist/format.js";

      const now = Date.now();
      const day = 86_400_000;
      const calls = [
        ["formatBytes(999)", formatBytes(999)],
        ["formatBytes(1000)", formatBytes(1000)],
        ["formatBytes(123456789)", formatBytes(123_456_789)],
        ["formatBytes(4.2e15)", formatBytes(4.2e15)],
        ['formatBytes(1500, undefined, { unitDisplay: "long" })', formatBytes(1500, undefined, { unitDisplay: "long" })],
        ["formatDate(now)", formatDate(now)],
        ['formatDate(now, undefined, { year: "numeric" })', formatDate(now, undefined, { year: "numeric" })],
        ["formatDateTime(now)", formatDateTime(now)],
        ["formatRelative(now - 59 s, undefined, { now })", formatRelative(now - 59_000, undefined, { now })],
        ["formatRelative(now - 3 days, undefined, { now })", formatRelative(now - 3 * day, undefined, { now })],
        ["formatRelative(now + 30 days, undefined, { now })", formatRelative(now + 30 * day, undefined, { now })],
        ["formatRelative(now - 400 days, undefined, { now })", formatRelative(now - 400 * day, undefined, { now })],
        ["formatDuration(0)", formatDuration(0)],
        ["formatDuration(999)", formatDuration(999)],
        ["formatDuration(93784000)", formatDuration(93_784_000)],
        ['formatDuration(93784000, undefined, { style: "long" })', formatDuration(93_784_000, undefined, { style: "long" })],
        ['formatDuration(93784000, undefined, { style: "digital" })', formatDuration(93_784_000, undefined, { style: "digital" })],
      ];

      const rows = document.getElementById("calls");
      for (const [call, output] of calls) {
        const row = rows.insertRow();
        const code = document.createElement("code");
        code.textContent = call;
        row.insertCell().append(code);
        row.insertCell().textContent = output;
      }

      const nested = "[".repeat(JSON_MAX_DEPTH + 2) + "1" + "]".repeat(JSON_MAX_DEPTH + 2);
      const samples = [
        ["Minified: keys in their order, duplicates and literals as written", '{"id":"run-1","10":2,"2":3,"n":1.50E+3,"stages":[{"name":"classify","ok":true,"err":null},{}],"id":"again"}'],
        ["Not JSON: a trailing comma", '{"a":1,}'],
        [`Nested ${JSON_MAX_DEPTH + 2} deep: the levels past ${JSON_MAX_DEPTH} kept as written`, nested, JSON_MAX_DEPTH - 3],
      ];
      const main = document.querySelector("main");
      const block = (label, text) => {
        const caption = document.createElement("p");
        caption.className = "text-quiet-s";
        caption.textContent = label;
        const pre = document.createElement("pre");
        pre.className = "scroll-x";
        pre.textContent = text;
        return [caption, pre];
      };
      for (const [name, text, from] of samples) {
        const result = tryFormatJson(text);
        const section = document.createElement("section");
        const heading = document.createElement("h3");
        heading.textContent = name;
        section.append(heading, ...block("Given", text));
        if (!result.ok) {
          section.append(...block("tryFormatJson: not JSON", result.reason));
        } else if (from === undefined) {
          section.append(...block("tryFormatJson", result.text));
        } else {
          const lines = result.text.split("\n");
          const excerpt = lines.slice(from, lines.length - from);
          const cut = Math.min(...excerpt.map((line) => line.length - line.trimStart().length));
          const label = `tryFormatJson, lines ${from + 1} to ${lines.length - from} of ${lines.length}, less their common ${cut} spaces of indent`;
          section.append(...block(label, excerpt.map((line) => line.slice(cut)).join("\n")));
        }
        main.append(section);
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Foundation formatters</h1>
      <p>
        <code>format.js</code>'s five Intl formatters, in this browser's locale and time zone, and
        its JSON formatter.
      </p>
      <div class="scroll-x">
        <table class="table-striped">
          <caption>
            Each call and what it printed
          </caption>
          <thead>
            <tr>
              <th>Call</th>
              <th>Output</th>
            </tr>
          </thead>
          <tbody id="calls"></tbody>
        </table>
      </div>
      <section>
        <h2>JSON</h2>
        <p>
          <code>tryFormatJson</code> on each sample below: the text given, then the text
          re-indented from its own tokens, or the parser's reason.
        </p>
      </section>
    </main>
  </body>
</html>
