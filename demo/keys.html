<!doctype html>
<!-- Adapted from spike-html-apps-foundation (07ba39a): demo/keys.html, its help dialog a plain list the page fills from bindings(). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation keys</title>
    <link rel="stylesheet" href="../dist/page.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" src="../dist/keys.js"></script>
    <script type="module">
      import { bindings, register } from "../dist/keys.js";

      const say = (text) => {
        const item = document.createElement("li");
        item.textContent = text;
        document.getElementById("log").prepend(item);
      };
      document.addEventListener("click", (event) => {
        const name = event.target.closest?.("[data-say]")?.dataset.say;
        if (name) say(name);
      });
      document.addEventListener("keys-sequence", ({ detail }) => {
        document.getElementById("pending").textContent =
          detail.state === "end" ? "" : detail.presses.join(" then ");
      });
      register("j", "Say j, a register() binding", () => say("j, from register()"));
      const help = document.getElementById("help");
      help.addEventListener("beforetoggle", (event) => {
        if (event.newState !== "open") return;
        const items = bindings(help).map(({ keys, label, element }) => {
          const text = label ?? (element.labels?.[0] ?? element).textContent;
          const item = document.createElement("li");
          item.textContent = `${keys}: ${text.trim().replace(/\s+/g, " ")}`;
          return item;
        });
        document.getElementById("help-list").replaceChildren(...items);
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Foundation keys</h1>
      <p>
        Press <kbd>?</kbd>, or the Help button, for the help dialog: this page lists every binding
        below in it, from bindings(), as it opens.
      </p>
      <p>
        <button type="button" commandfor="help" command="show-modal" data-keys="?">
          Help <kbd>?</kbd>
        </button>
        <button type="button" data-keys="t" data-say="Theme">Theme <kbd>T</kbd></button>
        <button type="button" data-keys="g c" data-say="Contents">
          Contents <kbd>G</kbd> then <kbd>C</kbd>
        </button>
        <button type="button" data-keys="g" data-say="Top">Top <kbd>G</kbd></button>
        <button type="button" data-keys="Mod+k" data-say="Command">
          Command <kbd>Mod</kbd>+<kbd>K</kbd>
        </button>
      </p>
      <p>
        <label>Search <kbd>/</kbd> <input type="search" data-keys="/" /></label>
        <small>Escape leaves the field.</small>
      </p>
      <p>Pending: <output id="pending"></output></p>
      <h2>Log</h2>
      <ol id="log" reversed></ol>
    </main>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <ul id="help-list">
        <li>The shortcuts run when this page is served: mise run demo.</li>
      </ul>
      <footer>
        <button type="button" commandfor="help" command="close" data-keys="?">
          Close <kbd>?</kbd>
        </button>
      </footer>
    </dialog>
  </body>
</html>
