<!doctype html>
<!-- Adapted from spike-html-apps-foundation (07ba39a): demo/unit.html, its theme menu replaced
     by the demo's own controls. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation unit</title>
    <!-- The lean page entry composed with one built-in unit, GitHub: its sheet linked after
         page.css, which it follows in the color sub-layer, and its registration module imported
         beside register.js, so the registry, and the demo's controls, list zen and github, and
         no other color. A profile from outside the package joins the same way. Its modules run
         served only: mise run demo. -->
    <link rel="stylesheet" href="../dist/page.css" />
    <link rel="stylesheet" href="../dist/profiles/color/github.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" blocking="render" src="../dist/register.js"></script>
    <script type="module" blocking="render" src="../dist/profiles/color/github.js"></script>
    <script type="module" blocking="render" src="../dist/preferences.js"></script>
    <script type="module" src="choice.js"></script>
  </head>
  <body>
    <main>
      <h1>Foundation unit</h1>
      <form data-choice>
        <div class="field">
          <label for="color">Color</label>
          <select id="color" name="color"></select>
        </div>
        <div class="field">
          <label for="scheme">Scheme</label>
          <select id="scheme" name="scheme"></select>
        </div>
        <div class="field">
          <label for="space">Space</label>
          <select id="space" name="space"></select>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type"></select>
        </div>
      </form>
      <p>
        This page links page.css and the GitHub unit alone. Color lists zen, the lean default, and
        github, the unit; space and type hold their defaults only.
      </p>
      <p>
        <a class="button" href="#color">A link button</a>
        <button class="button-blue" type="button">Deploy</button>
        <button class="button-red" type="button">Delete</button>
        <button class="button-green" type="button" disabled>Disabled</button>
      </p>
      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" class="field-grow" type="text" value="main" />
      </div>
      <table class="table-striped">
        <thead>
          <tr>
            <th scope="col">Run</th>
            <th scope="col">Status</th>
            <th scope="col">Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1204</td>
            <td>passed</td>
            <td>2m 14s</td>
          </tr>
          <tr>
            <td>1205</td>
            <td>failed</td>
            <td>48s</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
