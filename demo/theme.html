<!doctype html>
<!-- Adapted from spike-html-apps-foundation (07ba39a): demo/theme.html, its theme menu replaced by the demo's own controls. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation theme</title>
    <link rel="stylesheet" href="../dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" blocking="render" src="../dist/register-full.js"></script>
    <script type="module" blocking="render" src="../dist/preferences.js"></script>
    <script type="module" src="choice.js"></script>
  </head>
  <body>
    <main>
      <h1>Foundation theme</h1>
      <form data-choice>
        <div class="field">
          <label for="color">Color</label>
          <select id="color" name="color"></select>
        </div>
        <div class="field">
          <label for="scheme">Scheme</label>
          <select id="scheme" name="scheme"></select>
        </div>
        <div class="field">
          <label for="space">Space</label>
          <select id="space" name="space"></select>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type"></select>
        </div>
      </form>
      <p>
        Pick a color profile, a scheme, a space, and a type: each change applies at once and is
        kept. Reload, or open this page in a second tab, to see the choice kept.
      </p>
      <p>
        <a class="button" href="#color">A link button</a>
        <button class="button-blue" type="button">Deploy</button>
        <button class="button-red" type="button">Delete</button>
        <button class="button-green" type="button" disabled>Disabled</button>
      </p>
      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" class="field-grow" type="text" value="main" />
      </div>
      <table class="table-striped">
        <thead>
          <tr>
            <th scope="col">Run</th>
            <th scope="col">Status</th>
            <th scope="col">Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1204</td>
            <td>passed</td>
            <td>2m 14s</td>
          </tr>
          <tr>
            <td>1205</td>
            <td>failed</td>
            <td>48s</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
