# Adapted from web-tooling (1ff49e4): .github/workflows/ci.yml, renamed. mise run install installs
# every pin mise.toml names, the chrome-headless-shell the browser tier runs in included.
# From spike-html-apps-foundation (07ba39a): .github/workflows/ci.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.9

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
